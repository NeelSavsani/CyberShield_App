name: cybershield_app
description: "CyberShield — Real-Time Phishing & Threat Intelligence Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.1
  http_parser: ^4.0.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
